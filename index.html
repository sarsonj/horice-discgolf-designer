<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<meta name="theme-color" content="#2c7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Discgolf HC">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Discgolf Designer — Gotthard Hořice</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
body { display: flex; }
#map { flex: 1; height: 100vh; }

#sidebar { width: 360px; height: 100vh; overflow-y: auto; background: #f7f7f7; border-left: 1px solid #ccc; padding: 12px; font-size: 13px; }
#sidebar h2 { margin: 0 0 4px; font-size: 16px; }
#sidebar h2 small { font-weight: normal; color: #777; font-size: 11px; }
#sidebar h3 { margin: 14px 0 4px; font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 0.05em; }

.mode-btn { display: block; width: 100%; padding: 10px; margin-bottom: 4px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 4px; text-align: left; font-size: 13px; }
.mode-btn.active { background: #2c7; color: white; border-color: #2a6; font-weight: 600; }

.btn { padding: 8px 12px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 4px; font-size: 12px; margin: 0 4px 4px 0; min-height: 36px; }
.btn:hover { background: #eee; }
.btn:active { background: #ddd; }
.btn-danger { color: #c33; }
.btn-icon { padding: 6px 10px; }
.btn-primary { background: #2c7; color: white; border-color: #2a6; }
.btn-primary:hover { background: #2a6; }

.hole-row { padding: 8px 10px; margin-bottom: 3px; background: white; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
.hole-row.active { background: #fffbe6; border-color: #fb0; }
.hole-row.complete { border-left: 4px solid #2c7; }
.hole-row.partial { border-left: 4px solid #fb0; }
.hole-row:hover { background: #fafafa; }
.hole-row .info { flex: 1; }
.hole-row .meta { font-size: 11px; color: #777; }

/* SVG markery (anchor v středu pad / na základně sloupu) */
.marker-svg { pointer-events: auto; }
.tooltip-dist .name { font-weight: 700; color: #2c7; display: block; }
.tooltip-dist .meters { font-weight: 400; color: #888; font-size: 10px; display: block; }

.popup-form { min-width: 220px; font-size: 14px; }
.popup-form label { display: block; margin: 4px 0; font-size: 12px; }
.popup-form input { width: 100%; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
.popup-form .row { display: flex; gap: 4px; margin-top: 8px; }
.popup-form button { flex: 1; padding: 10px; cursor: pointer; font-size: 13px; border: 1px solid #ccc; background: white; border-radius: 4px; }
.popup-form button.btn-primary { background: #2c7; color: white; border-color: #2a6; }

.tip { background: #fff8d0; padding: 8px; border-left: 3px solid #fb0; font-size: 11px; margin: 4px 0; line-height: 1.5; }
#stats { font-size: 12px; padding: 6px; background: white; border-radius: 4px; border: 1px solid #ddd; }
input[type=range] { width: 100%; }
/* Permanentní popisek metrů na dráze — decentní */
.tooltip-dist { background: rgba(255,255,255,0.85); padding: 1px 5px; border-radius: 3px; font-weight: 600; font-size: 10px; color: #555; border: none; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
/* Hover tooltip s názvem jamky */
.tooltip-name { background: #2c7; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.3); border: none; }
.tooltip-name::before { border-top-color: #2c7 !important; }
.tooltip-name::after { display: none; }
.variant-bar { display: flex; gap: 2px; align-items: center; margin-bottom: 4px; }
.variant-bar select { flex: 1; padding: 6px; font-size: 13px; }
.parcel-popup b { font-size: 13px; }
.parcel-popup a { display: inline-block; margin-top: 6px; padding: 6px 10px; background: #2c7; color: white; text-decoration: none; border-radius: 3px; font-size: 12px; }

/* Notes & photos */
.popup-form textarea { width: 100%; padding: 6px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; min-height: 50px; }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; }
.photo-thumb { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 4px; background: #eee; cursor: pointer; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
.photo-thumb .del-btn { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; cursor: pointer; font-size: 14px; padding: 0; line-height: 18px; }
.photo-add { aspect-ratio: 1; border: 2px dashed #aaa; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #777; cursor: pointer; background: white; }
.photo-add:hover { background: #f0f0f0; border-color: #2c7; color: #2c7; }
.photo-add input { display: none; }
.parcel-link-row { background: #f0f8ff; border-radius: 4px; padding: 6px 8px; margin: 6px 0; font-size: 12px; }
.parcel-link-row a, .parcel-link-row button { color: #1e88e5; text-decoration: none; }
.parcel-link-row a:hover { text-decoration: underline; }
.parcel-link-row .row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.parcel-link-row .row > * {
  flex: 1; min-width: 0;
  padding: 6px 8px; background: white; border: 1px solid #1e88e5;
  border-radius: 4px; font-size: 11px; cursor: pointer; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Lock toggle button v mapě */
#lock-toggle {
  position: absolute; top: 80px; left: 10px;
  z-index: 1000;
  width: 36px; height: 36px;
  background: white; border: 2px solid #ccc; border-radius: 4px;
  cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
#lock-toggle:hover { background: #f0f0f0; }
#lock-toggle.locked { background: #fff3cd; border-color: #e63; color: #c33; }
#lock-toggle .icon { line-height: 1; }

/* Photo viewer modal */
#photo-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9000; display: none; align-items: center; justify-content: center; flex-direction: column; }
#photo-viewer.show { display: flex; }
#photo-viewer img { max-width: 95vw; max-height: 85vh; object-fit: contain; }
#photo-viewer .close-btn { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 50%; font-size: 22px; cursor: pointer; }

/* Mobile sheet close button */
#sheet-close-btn { display: none; }

/* --- GPS uživatel marker --- */
.gps-pulse {
  width: 16px; height: 16px; border-radius: 50%;
  background: #2196f3; border: 2px solid white;
  box-shadow: 0 0 0 4px rgba(33,150,243,0.3), 0 1px 4px rgba(0,0,0,0.5);
}

/* --- Mobil --- */
#mobile-bar { display: none; }
#fab-use-gps { display: none; }

/* Indikátor neexportovaných změn */
#export-badge {
  background: #e63; color: white; border-radius: 10px;
  padding: 1px 6px; font-size: 10px; font-weight: bold;
  margin-left: 4px;
}
#export-badge.hidden { display: none; }

#toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.85); color: white; padding: 10px 16px;
  border-radius: 6px; font-size: 13px; z-index: 5000;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
  max-width: 90vw;
}
#toast.show { opacity: 1; pointer-events: auto; }

#gps-status {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  background: rgba(33,150,243,0.95); color: white; padding: 4px 10px;
  border-radius: 12px; font-size: 11px; z-index: 4000;
  display: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}
#gps-status.show { display: block; }
#gps-status.warn { background: rgba(230,150,0,0.95); }

/* Dialog "Použít moji polohu" / hole-note */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 5000; display: none;
}
.modal-backdrop.show { display: block; }
.modal {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: white; border-radius: 12px 12px 0 0;
  z-index: 5001;
  /* dvh = dynamic viewport height (počítá s mobilní lištou) */
  max-height: 88vh; max-height: 88dvh;
  display: none;
  flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.modal.show { display: flex; }
.modal h3 { margin: 0; font-size: 16px; padding: 16px 16px 8px; flex-shrink: 0; }
.modal-body { padding: 0 16px; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
.modal-actions {
  display: flex; gap: 6px; padding: 12px 16px;
  border-top: 1px solid #eee; background: white;
  flex-shrink: 0;
}
.modal-actions button { flex: 1; padding: 12px; font-size: 14px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: white; }
.modal-actions button.btn-primary { background: #2c7; color: white; border-color: #2a6; font-weight: 600; }
.target-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.target-btn {
  padding: 14px 10px; border: 1px solid #ccc; background: white;
  border-radius: 6px; cursor: pointer; font-size: 13px; text-align: left;
}
.target-btn.exists { background: #f0fff0; border-color: #2c7; }
.target-btn:active { background: #ddd; }
.target-btn .dist { font-size: 11px; color: #777; }

@media (max-width: 768px) {
  body { flex-direction: column; }
  #map { width: 100%; height: 100vh; }

  #sidebar {
    position: fixed; left: 0; right: 0; bottom: 0;
    width: 100%; height: auto; max-height: 75vh;
    border-left: none; border-top: 1px solid #ccc;
    border-radius: 12px 12px 0 0;
    transform: translateY(100%);
    transition: transform 0.25s ease-out;
    z-index: 2000; padding-top: 24px;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.2);
  }
  #sidebar.expanded { transform: translateY(0); }
  #sidebar::before {
    content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 4px; background: #ccc; border-radius: 2px;
  }
  #sidebar h2 { font-size: 14px; }
  #sheet-close-btn {
    display: flex;
    position: absolute; top: 4px; right: 8px;
    width: 36px; height: 36px;
    align-items: center; justify-content: center;
    font-size: 24px; color: #555; cursor: pointer;
    background: transparent; border: none;
    z-index: 10;
  }

  /* Spodní lišta */
  #mobile-bar {
    display: flex;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: white; border-top: 1px solid #ccc;
    z-index: 1500;
    padding: 8px;
    gap: 4px;
    box-shadow: 0 -1px 4px rgba(0,0,0,0.1);
  }
  #mobile-bar button {
    flex: 1; padding: 12px 4px; border: 1px solid #ddd;
    background: white; border-radius: 6px; font-size: 11px;
    display: flex; flex-direction: column; align-items: center;
    gap: 2px; cursor: pointer; min-height: 56px;
    position: relative;
  }
  #mobile-bar button.active { background: #2c7; color: white; border-color: #2a6; }
  #mobile-bar button.gps-on { background: #2196f3; color: white; border-color: #1e88e5; }
  #mobile-bar button .icon { font-size: 18px; }
  #mobile-bar button .label { font-size: 10px; }

  /* FAB Use My GPS */
  #fab-use-gps {
    display: block;
    position: fixed; bottom: 80px; right: 16px;
    background: #2196f3; color: white;
    width: auto; padding: 12px 16px;
    border: none; border-radius: 28px;
    font-size: 14px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    z-index: 1600; cursor: pointer;
    transform: scale(0); transition: transform 0.2s;
  }
  #fab-use-gps.show { transform: scale(1); }
  #fab-use-gps:active { background: #1e88e5; }

  /* Větší markery pro touch */
  .marker-icon { width: 36px; height: 36px; font-size: 12px; }

  /* Skrýt některé položky v sidebaru na mobilu */
  #sidebar h2 small { display: none; }

  /* Leaflet popup — omezit výšku a povolit scroll */
  .leaflet-popup-content-wrapper {
    max-height: 65vh;
    max-height: 65dvh;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .leaflet-popup-content {
    margin: 12px !important;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1; min-height: 0;
    max-width: calc(100vw - 60px) !important;
    width: calc(100vw - 60px) !important;
  }
  .leaflet-popup-content .popup-form {
    min-width: 0 !important;
  }
  /* Bottom-safe pro modaly + sidebar */
  #sidebar { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); }
  /* Sidebar height pomocí dvh */
  #sidebar { max-height: 75vh; max-height: 75dvh; }
}
</style>
</head>
<body>

<div id="map"></div>

<button id="lock-toggle" onclick="toggleLock()" title="Zamknout / odemknout body proti přesouvání">
  <span class="icon">🔓</span>
</button>

<div id="gps-status"></div>

<button id="fab-use-gps" onclick="openUseGPSDialog()">📍 Použít moji polohu</button>

<div id="mobile-bar">
  <button id="mob-gps" onclick="toggleGeo()"><span class="icon">📍</span><span class="label">GPS</span></button>
  <button id="mob-tee" onclick="setMobileMode('add-tee')"><span class="icon">⊕T</span><span class="label">Tee</span></button>
  <button id="mob-basket" onclick="setMobileMode('add-basket')"><span class="icon">⊕K</span><span class="label">Koš</span></button>
  <button id="mob-sheet" onclick="toggleSidebar()"><span class="icon">📋</span><span class="label">Menu</span></button>
  <button id="mob-export" onclick="exportJSON()"><span class="icon">💾</span><span class="label">Export<span id="export-badge" class="hidden">0</span></span></button>
</div>

<div id="sidebar">
  <button id="sheet-close-btn" onclick="toggleSidebar()" aria-label="Zavřít">×</button>
  <h2>Discgolf Designer<br><small>Sochařský park Gotthard, Hořice</small></h2>

  <h3>Návrh hřiště</h3>
  <div class="variant-bar">
    <select id="variant-select"></select>
    <button class="btn btn-icon" title="Přejmenovat" onclick="renameVariant()">✎</button>
    <button class="btn btn-icon" title="Duplikovat" onclick="duplicateVariant()">⎘</button>
    <button class="btn btn-icon" title="Nový" onclick="newVariant()">+</button>
    <button class="btn btn-icon btn-danger" title="Smazat" onclick="deleteVariant()">×</button>
  </div>
  <button class="btn" onclick="openLoadLayoutDialog()" style="font-size:11px;">📂 Načíst hotový layout</button>

  <h3>Režim</h3>
  <button class="mode-btn active" data-mode="view">Prohlížet / editovat</button>
  <button class="mode-btn" data-mode="add-tee">+ Klikem přidat ODPALIŠTĚ</button>
  <button class="mode-btn" data-mode="add-basket">+ Klikem přidat KOŠ</button>

  <h3>Aktivní jamka</h3>
  <div style="display:flex; gap:4px; align-items:center;">
    <select id="current-hole" style="flex:1; padding:6px;"></select>
    <button class="btn" onclick="newHole()">+ Nová</button>
  </div>

  <h3>Jamky</h3>
  <div id="hole-list"></div>
  <div id="stats"></div>

  <h3>Vrstvy</h3>
  <label><input type="checkbox" id="show-sculptures" checked> Sochy (<span id="sculpt-count">0</span>)</label><br>
  <label><input type="checkbox" id="show-buffers"> Bezpečnostní zóny kolem soch</label>
  <div id="buffer-radius-wrap" style="display:none; padding-left:20px;">
    Radius: <span id="buffer-r-val">15</span> m
    <input type="range" id="buffer-radius" min="5" max="30" value="15" step="1">
  </div>
  <label><input type="checkbox" id="show-parcels"> Katastrální parcely (<span id="parcel-count">0</span>)</label>
  <label><input type="checkbox" id="show-park-boundary"> Hranice parku</label>

  <h3>Export / Import</h3>
  <button class="btn btn-primary" onclick="exportJSON()">📥 JSON <span id="export-badge2"></span></button>
  <button class="btn" onclick="exportKML()">KML</button>
  <button class="btn" onclick="exportGPX()">GPX</button>
  <br><br>
  <input type="file" id="import-file" accept=".json,.gpx" style="font-size:11px;">
  <div id="export-info" style="font-size:11px; color:#777; margin-top:8px;"></div>
  <br>
  <button class="btn btn-danger" onclick="resetActiveHoles()">Smazat všechny jamky v tomto návrhu</button>
</div>

<div id="modal-backdrop" class="modal-backdrop" onclick="closeAllModals()"></div>
<div id="use-gps-dialog" class="modal">
  <h3>Použít moji polohu pro…</h3>
  <div class="modal-body">
    <div id="gps-accuracy-info" style="font-size:12px; color:#777; margin-bottom:8px;"></div>
    <div id="target-list" class="target-list"></div>
  </div>
  <div class="modal-actions">
    <button onclick="closeAllModals()">Zrušit</button>
  </div>
</div>

<div id="load-layout-dialog" class="modal">
  <h3>Načíst hotový layout</h3>
  <div class="modal-body">
    <div style="font-size:12px;color:#666;margin-bottom:8px;">Vyber layout ze serveru. Můžeš ho přidat jako nový návrh nebo nahradit aktuální.</div>
    <div id="layout-list" style="display:flex;flex-direction:column;gap:6px;"></div>
  </div>
  <div class="modal-actions">
    <button onclick="closeAllModals()">Zrušit</button>
  </div>
</div>

<div id="hole-note-dialog" class="modal">
  <h3 id="hole-note-title">Poznámka k jamce</h3>
  <div class="modal-body">
    <label>Název jamky:</label>
    <input type="text" id="hole-name-input" placeholder="např. Před branou, Apollo 11..."
      style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px;margin-bottom:4px;">
    <label>Reference sochy (volitelné):</label>
    <input type="text" id="hole-sculpture-ref" placeholder="např. Birgit Knappe, Německo, 1994"
      style="width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:13px;margin-bottom:8px;">
    <label>Poznámka:</label>
    <textarea id="hole-note-text" style="width:100%;min-height:60px;padding:8px;border:1px solid #ccc;border-radius:4px;font-size:14px;"></textarea>
    <label style="margin-top:8px;display:block;">Fotky:</label>
    <div id="hole-note-photos"></div>
    <label class="photo-add" style="margin-top:6px;display:flex;">
      📷 Přidat foto
      <input type="file" accept="image/*" capture="environment" id="hole-note-photo-input">
    </label>
  </div>
  <div class="modal-actions">
    <button class="btn-primary" id="hole-note-save">Uložit</button>
    <button onclick="closeAllModals()">Zrušit</button>
  </div>
</div>

<div id="toast"></div>

<div id="photo-viewer" onclick="closePhotoViewer()">
  <button class="close-btn" onclick="event.stopPropagation(); closePhotoViewer()">×</button>
  <img id="photo-viewer-img" src="" alt="">

function defaultData() {
  return {
    variants: [
      { id: 'parklife', name: 'Parklife (původní návrh)', color: '#1e88e5', holes: JSON.parse(JSON.stringify(PARKLIFE_DEFAULT)) },
      { id: 'moj', name: 'Můj návrh', color: '#2c7', holes: [] },
    ],
    activeVariantId: 'parklife',
    changesSinceExport: 0,
    locked: false,
  };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && p.variants && p.variants.length) {
        if (typeof p.changesSinceExport !== 'number') p.changesSinceExport = 0;
        return p;
      }
    }
  } catch (e) {}
  // migrace ze starších verzí
  for (const oldKey of ['horice_data_v2', 'horice_data']) {
    try {
      const raw = localStorage.getItem(oldKey);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && p.variants) { p.changesSinceExport = 0; return p; }
      }
    } catch {}
  }
  try {
    const legacy = localStorage.getItem('horice_holes');
    if (legacy) {
      const oldHoles = JSON.parse(legacy);
      if (Array.isArray(oldHoles) && oldHoles.length) {
        const d = defaultData();
        d.variants[1].holes = oldHoles;
        d.activeVariantId = 'moj';
        return d;
      }
    }
  } catch {}
  return defaultData();
}

// --- Pomocné: parcel lookup pod bodem ---
function pointInPolygon(lat, lon, polygon) {
  let inside = false; const n = polygon.length;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = polygon[i][0], yi = polygon[i][1];
    const xj = polygon[j][0], yj = polygon[j][1];
    if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi + 1e-12) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}
function findParcelAt(lat, lon) {
  for (const f of PARCELS.features) {
    const coords = f.geometry.coordinates[0];
    if (pointInPolygon(lat, lon, coords)) return f.properties;
  }
  return null;
}

function compressImageToDataURL(file, maxDim = 1280, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function haversine(p1, p2) {
  const R = 6371000;
  const dLat = (p2.lat - p1.lat) * Math.PI / 180;
  const dLon = (p2.lon - p1.lon) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(p1.lat*Math.PI/180)*Math.cos(p2.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

    const lines = [`<b>${s.name}</b>`];
    if (s.artist) lines.push('Autor: ' + s.artist);
    if (s.year) lines.push('Rok: ' + s.year);
    if (s.material) lines.push('Materiál: ' + s.material);
    lines.push('<i>' + s.park + '</i>');
    m.bindTooltip(lines.join('<br>'), { direction: 'top' });
    m.addTo(map);
    sculptureMarkers.push(m);
  });
}

function renderBuffers() {
  bufferCircles.forEach(c => map.removeLayer(c));
  bufferCircles = [];
  if (!document.getElementById('show-buffers').checked) return;
  SCULPTURES.forEach(s => {
    const c = L.circle([s.lat, s.lon], { radius: bufferRadius, color: '#d44', fillColor: '#d44', fillOpacity: 0.06, weight: 1, dashArray: '3,3' });
    c.addTo(map);
    bufferCircles.push(c);
  });
}

function renderParcels() {
  if (parcelLayer) { map.removeLayer(parcelLayer); parcelLayer = null; }
  if (!document.getElementById('show-parcels').checked) return;
  parcelLayer = L.geoJSON(PARCELS, {
    style: feat => {
      // Trvale soukromé parcely (forced): vždy červeně bez ohledu na localStorage
      if (feat.properties.private) {
        return { color: '#c30', weight: 2, fillColor: '#c30', fillOpacity: 0.25, dashArray: '4,3' };
      }
      const owner = parcelOwners[feat.properties.natref];
      let color = '#888', fill = '#888', op = 0.05;
      if (owner === 'mesto') { color = '#0c3'; fill = '#0c3'; op = 0.15; }
      else if (owner === 'jine') { color = '#c30'; fill = '#c30'; op = 0.15; }
      else if (owner === 'nezname') { color = '#fc0'; fill = '#fc0'; op = 0.10; }
      return { color, weight: 1, fillColor: fill, fillOpacity: op };
    },
    onEachFeature: (feat, layer) => {
      const p = feat.properties;
      // Použij referenční bod parcely (její střed) pro otevření iKatastru
      let plat = null, plon = null;
      try {
        const coords = feat.geometry.coordinates[0];
        plon = coords.reduce((a, c) => a + c[0], 0) / coords.length;
        plat = coords.reduce((a, c) => a + c[1], 0) / coords.length;
      } catch {}
      const ikatUrl = `https://www.ikatastr.cz/#kde=${plat||50.3665},${plon||15.6435},20&mapa=zakladni&info=parcela`;
      const owner = parcelOwners[p.natref] || 'nezadano';
      layer.bindPopup(() => {
        const div = document.createElement('div');
        div.className = 'parcel-popup';
        div.style.minWidth = '0';
        const privateBadge = p.private ? `<div style="background:#fee; color:#c30; padding:4px 6px; border-radius:3px; margin:4px 0; font-size:11px; font-weight:600;">⚠️ ${p.note || 'Soukromý pozemek'}</div>` : '';
        div.innerHTML = `
          <b>Parcela ${p.label}</b><br>
          <small>k.ú. Hořice v Podkrkonoší (645168)</small><br>
          ${privateBadge}
          Výměra: <b>${p.area_m2.toLocaleString('cs')} m²</b><br>
          Vlastník (po ověření):
          <select class="owner-select" style="width:100%;padding:5px;margin-top:4px;">
            <option value="nezadano">— nezadáno —</option>
            <option value="mesto" ${owner==='mesto'?'selected':''}>Město Hořice ✓</option>
            <option value="jine" ${owner==='jine'?'selected':''}>Jiný (soukromý)</option>
            <option value="nezname" ${owner==='nezname'?'selected':''}>Sporné</option>
          </select>
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;">
            <button class="copy-parcel" data-parcel="${p.label}" style="flex:1;padding:6px;background:white;border:1px solid #1e88e5;border-radius:4px;font-size:11px;cursor:pointer;color:#1e88e5;">📋 Kopírovat č.</button>
            <a href="${ikatUrl}" target="_blank" style="flex:1;padding:6px;background:white;border:1px solid #1e88e5;border-radius:4px;font-size:11px;text-align:center;color:#1e88e5;">🗺️ iKatastr</a>
            <a href="https://sgi-nahlizenidokn.cuzk.gov.cz/marushka/default.aspx?themeid=3" target="_blank" style="flex:1;padding:6px;background:white;border:1px solid #1e88e5;border-radius:4px;font-size:11px;text-align:center;color:#1e88e5;">🌐 ČÚZK mapa</a>
          </div>
        `;
        div.querySelector('.owner-select').onchange = (e) => {
          if (e.target.value === 'nezadano') delete parcelOwners[p.natref];
          else parcelOwners[p.natref] = e.target.value;
          localStorage.setItem(PARCEL_OWNERS_KEY, JSON.stringify(parcelOwners));
          renderParcels();
        };
        const cb = div.querySelector('.copy-parcel');
        if (cb) cb.onclick = async (e) => {
          e.preventDefault();
          try { await navigator.clipboard.writeText(cb.dataset.parcel); }
          catch { const ta = document.createElement('textarea'); ta.value = cb.dataset.parcel; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
          showToast(`Zkopírováno: ${cb.dataset.parcel}`, 2500);
        };
        return div;
      }, {
        autoPan: true,
        autoPanPaddingTopLeft: L.point(20, 20),
        autoPanPaddingBottomRight: L.point(20, 80),
        maxWidth: 320,
        keepInView: true
      });
      layer.bindTooltip(`P${p.label}`, { sticky: true });
    }
  }).addTo(map);
  parcelLayer.bringToBack();
  document.getElementById('parcel-count').textContent = PARCELS.features.length;
}

function renderParkBoundary() {
  if (parkBoundaryLayer) { map.removeLayer(parkBoundaryLayer); parkBoundaryLayer = null; }
  if (!document.getElementById('show-park-boundary').checked) return;
  // Žlutá tenká linka — vizuálně odlišná od zelených drah jamek
  parkBoundaryLayer = L.geoJSON(PARK_POLYGON, {
    style: { color: '#f4a200', weight: 2.5, fillColor: '#f4d000', fillOpacity: 0.06, opacity: 0.85 }
  }).addTo(map);
  parkBoundaryLayer.bringToBack();
}

function renderPhotoGrid(photos, onDelete) {
  if (!photos || photos.length === 0) return '<div style="color:#999;font-size:11px;">Žádné fotky</div>';
  return '<div class="photo-grid">' + photos.map((p, i) =>
    `<div class="photo-thumb" data-i="${i}">
       <img src="${p}" alt="">
       <button class="del-btn" data-del="${i}">×</button>
     </div>`
  ).join('') + '</div>';
}

function makePopup(hole, type) {
  const point = hole[type];
  if (!point.photos) point.photos = [];
  if (point.note === undefined) point.note = '';

  const parcel = findParcelAt(point.lat, point.lon);
  const ikatUrl = `https://www.ikatastr.cz/#kde=${point.lat},${point.lon},19&mapa=zakladni&info=parcela`;
  const nahlizUrl = `https://sgi-nahlizenidokn.cuzk.gov.cz/marushka/default.aspx?themeid=3`;
  const parcelHtml = parcel
    ? `<div class="parcel-link-row">
         📐 Parcela <b>${parcel.label}</b> (${parcel.area_m2.toLocaleString('cs')} m²)<br>
         <small>k.ú. Hořice v Podkrkonoší (645168)</small>
         <div class="row">
           <button class="copy-parcel" data-parcel="${parcel.label}">📋 Kopírovat č.</button>
           <a href="${ikatUrl}" target="_blank">🗺️ iKatastr</a>
           <a href="${nahlizUrl}" target="_blank">🌐 ČÚZK mapa</a>
         </div>
       </div>`
    : `<div class="parcel-link-row" style="background:#fff3f0;">
         ⚠️ Bod není na žádné evidované parcele parku
         <div class="row"><a href="${ikatUrl}" target="_blank">🗺️ Otevřít iKatastr</a></div>
       </div>`;

  const div = document.createElement('div');
  div.className = 'popup-form';
  div.innerHTML = `
    <b>Jamka ${hole.id} — ${type === 'tee' ? 'Odpaliště' : 'Koš'}</b>
    <div style="font-size:11px;color:#777;margin:2px 0">${activeVariant().name}</div>
    ${parcelHtml}
    <label>Lat: <input type="number" step="0.0000001" class="lat-in" value="${point.lat.toFixed(7)}" inputmode="decimal"></label>
    <label>Lon: <input type="number" step="0.0000001" class="lon-in" value="${point.lon.toFixed(7)}" inputmode="decimal"></label>
    <label>Poznámka:
      <textarea class="note-in" placeholder="Např. velký kámen vlevo, ostrý úhel...">${point.note}</textarea>
    </label>
    <label>Fotky:</label>
    <div class="photo-list">${renderPhotoGrid(point.photos)}</div>
    <label class="photo-add" style="margin-top:6px;">
      📷 Přidat foto
      <input type="file" accept="image/*" capture="environment" class="photo-input">
    </label>
    <div class="row">
      <button class="btn-primary btn-update">Uložit</button>
      <button class="btn-delete" style="color:red">Smazat bod</button>
    </div>
  `;

  const refreshPhotos = () => {
    div.querySelector('.photo-list').innerHTML = renderPhotoGrid(point.photos);
    attachPhotoHandlers();
  };
  const attachPhotoHandlers = () => {
    div.querySelectorAll('.photo-thumb img').forEach(img => {
      img.onclick = () => openPhotoViewer(img.src);
    });
    div.querySelectorAll('.del-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const i = parseInt(btn.dataset.del);
        if (confirm('Smazat foto?')) {
          point.photos.splice(i, 1);
          bumpChanges(); save();
          refreshPhotos();
        }
      };
    });
  };
  attachPhotoHandlers();

  // Copy parcel number
  const copyBtn = div.querySelector('.copy-parcel');
  if (copyBtn) {
    copyBtn.onclick = async (e) => {
      e.preventDefault();
      const parcelNum = copyBtn.dataset.parcel;
      try {
        await navigator.clipboard.writeText(parcelNum);
        showToast(`Zkopírováno: ${parcelNum}`, 2500);
      } catch {
        // Fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = parcelNum; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        showToast(`Zkopírováno: ${parcelNum}`, 2500);
      }
    };
  }

  div.querySelector('.photo-input').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const dataUrl = await compressImageToDataURL(file);
      point.photos.push(dataUrl);
      bumpChanges();
      try { save(); } catch (err) {
        if (err.name === 'QuotaExceededError') {
          point.photos.pop();
          alert('Nedostatek místa v prohlížeči. Stáhni si JSON export, smaž starší fotky a zkus znovu.');
          return;
        }
        throw err;
      }
      refreshPhotos();
      showToast('Foto přidáno', 1500);
    } catch (err) {
      alert('Chyba při zpracování fotky: ' + err.message);
    }
    e.target.value = '';
  };

  div.querySelector('.btn-update').onclick = () => {
    const lat = parseFloat(div.querySelector('.lat-in').value);
    const lon = parseFloat(div.querySelector('.lon-in').value);
    const note = div.querySelector('.note-in').value;
    if (isFinite(lat) && isFinite(lon)) {
      point.lat = lat; point.lon = lon; point.note = note;
      bumpChanges();
      saveAndRender();
      map.closePopup();
    }
  };
  div.querySelector('.btn-delete').onclick = () => {
    if (!confirm(`Smazat ${type === 'tee' ? 'odpaliště' : 'koš'} jamky ${hole.id}?`)) return;
    delete hole[type];
    bumpChanges();
    saveAndRender();
    map.closePopup();
  };
  return div;
}

function openHoleNoteDialog(hole) {
  if (!hole.photos) hole.photos = [];
  if (hole.note === undefined) hole.note = '';
  if (hole.name === undefined) hole.name = '';
  if (hole.sculpture_ref === undefined) hole.sculpture_ref = '';
  const dialog = document.getElementById('hole-note-dialog');
  document.getElementById('hole-note-title').textContent = `Jamka ${hole.id} — detaily`;
  document.getElementById('hole-name-input').value = hole.name;
  document.getElementById('hole-sculpture-ref').value = hole.sculpture_ref;
  document.getElementById('hole-note-text').value = hole.note;
  const photoListEl = document.getElementById('hole-note-photos');
  const refresh = () => {
    photoListEl.innerHTML = renderPhotoGrid(hole.photos);
    photoListEl.querySelectorAll('.photo-thumb img').forEach(img => {
      img.onclick = () => openPhotoViewer(img.src);
    });
    photoListEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const i = parseInt(btn.dataset.del);
        if (confirm('Smazat foto?')) { hole.photos.splice(i, 1); bumpChanges(); save(); refresh(); renderHoleList(); }
      };
    });
  };
  refresh();
  document.getElementById('hole-note-photo-input').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const dataUrl = await compressImageToDataURL(file);
      hole.photos.push(dataUrl);
      bumpChanges();
      try { save(); } catch (err) {
        if (err.name === 'QuotaExceededError') { hole.photos.pop(); alert('Nedostatek místa.'); return; }
        throw err;
      }
      refresh(); renderHoleList(); showToast('Foto přidáno', 1500);
    } catch (err) { alert('Chyba: ' + err.message); }
    e.target.value = '';
  };
  document.getElementById('hole-note-save').onclick = () => {
    hole.name = document.getElementById('hole-name-input').value.trim();
    hole.sculpture_ref = document.getElementById('hole-sculpture-ref').value.trim();
    hole.note = document.getElementById('hole-note-text').value;
    bumpChanges(); saveAndRender();
    document.getElementById('modal-backdrop').classList.remove('show');
    dialog.classList.remove('show');
  };
  document.getElementById('modal-backdrop').classList.add('show');
  dialog.classList.add('show');
}

// Tee SVG — pad s "+" křížkem ve středu (= GPS bod = kde stojí hráč)
function teeSVG(color, num) {
  return `<svg viewBox="0 0 40 40" width="100%" height="100%" class="marker-svg">
    <ellipse cx="20" cy="38" rx="11" ry="1.5" fill="rgba(0,0,0,0.25)"/>
    <path d="M6 22 L34 22 L32 36 L8 36 Z" fill="${color}" stroke="white" stroke-width="1.5"/>
    <path d="M6 22 L34 22 L33 26 L7 26 Z" fill="rgba(255,255,255,0.35)"/>
    <line x1="16" y1="31" x2="24" y2="31" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="20" y1="27" x2="20" y2="35" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="20" cy="10" r="9" fill="white" stroke="${color}" stroke-width="2.5"/>
    <text x="20" y="14" text-anchor="middle" font-size="13" font-weight="700" fill="${color}">${num}</text>
  </svg>`;
}
// Basket SVG — pole na (20, 44) = GPS bod (kde se betonuje)
function basketSVG(color, num) {
  return `<svg viewBox="0 0 40 46" width="100%" height="100%" class="marker-svg">
    <ellipse cx="20" cy="44" rx="6" ry="1.5" fill="rgba(0,0,0,0.35)"/>
    <rect x="18.5" y="22" width="3" height="22" fill="${color}"/>
    <path d="M8 28 Q20 34 32 28 L30 22 L10 22 Z" fill="${color}" stroke="white" stroke-width="1.5"/>
    <ellipse cx="20" cy="14" rx="11" ry="3" fill="${color}" stroke="white" stroke-width="1.5"/>
    <line x1="12" y1="14" x2="13" y2="22" stroke="white" stroke-width="1"/>
    <line x1="16" y1="15" x2="17" y2="22" stroke="white" stroke-width="1"/>
    <line x1="20" y1="15.5" x2="20" y2="22" stroke="white" stroke-width="1"/>
    <line x1="24" y1="15" x2="23" y2="22" stroke="white" stroke-width="1"/>
    <line x1="28" y1="14" x2="27" y2="22" stroke="white" stroke-width="1"/>
    <circle cx="20" cy="44" r="1.5" fill="white" stroke="${color}" stroke-width="0.5"/>
    <circle cx="20" cy="7" r="6.5" fill="white" stroke="${color}" stroke-width="2"/>
    <text x="20" y="10" text-anchor="middle" font-size="10" font-weight="700" fill="${color}">${num}</text>
  </svg>`;
}

function createMarker(type, hole) {
  const point = hole[type];
  const color = activeVariant().color || '#2c7';
  const isBasket = type === 'basket';
  const svgHtml = isBasket ? basketSVG('#e63', hole.id) : teeSVG(color, hole.id);
  const icon = L.divIcon({
    className: '',
    html: svgHtml,
    iconSize: isBasket ? [40, 46] : [40, 40],
    iconAnchor: isBasket ? [20, 44] : [20, 31]
  });
  const m = L.marker([point.lat, point.lon], { draggable: !data.locked, icon: icon, autoPan: true }).addTo(map);
  m.on('dragend', e => {
    const ll = e.target.getLatLng();
    hole[type] = { lat: ll.lat, lon: ll.lng };
    bumpChanges();
    saveAndRender();
  });
  // Hover tooltip s názvem (desktop) — na mobilu název v popupu
  const nameLbl = hole.name ? `J${hole.id} — ${(hole.name+'').replace(/[<>&]/g,'')}` : `J${hole.id}`;
  m.bindTooltip(nameLbl, { direction: 'top', offset: isBasket ? [0, -16] : [0, -8], className: 'tooltip-name' });
  // Popup: autoPanPadding počítá s bottom toolbarem (60px) + bezpečnou rezervou
  m.bindPopup(() => makePopup(hole, type), {
    autoPan: true,
    autoPanPaddingTopLeft: L.point(20, 20),
    autoPanPaddingBottomRight: L.point(20, 80),
    maxWidth: 360,
    keepInView: true
  });
  return m;
}

function renderHoles() {
  Object.values(markersByHole).forEach(g => {
    if (g.tee) map.removeLayer(g.tee);
    if (g.basket) map.removeLayer(g.basket);
    if (g.line) map.removeLayer(g.line);
  });
  markersByHole = {};
  const color = activeVariant().color || '#2c7';
  holes().forEach(hole => {
    const g = {};
    if (hole.tee) g.tee = createMarker('tee', hole);
    if (hole.basket) g.basket = createMarker('basket', hole);
    if (hole.tee && hole.basket) {
      g.line = L.polyline([[hole.tee.lat, hole.tee.lon], [hole.basket.lat, hole.basket.lon]], { color: color, weight: 3, dashArray: '6,5' }).addTo(map);
      const d = haversine(hole.tee, hole.basket);
      g.line.bindTooltip(`${d.toFixed(0)} m`, { permanent: true, direction: 'center', className: 'tooltip-dist' });
    }
    markersByHole[hole.id] = g;
  });
}

function renderVariantBar() {
  const sel = document.getElementById('variant-select');
  sel.innerHTML = '';
  data.variants.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.id; opt.textContent = v.name;
    if (v.id === data.activeVariantId) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { data.activeVariantId = sel.value; currentHoleId = holes().length ? holes()[0].id : null; saveAndRender(); };
}

function renderHoleSelector() {
  const sel = document.getElementById('current-hole');
  sel.innerHTML = '';
  if (holes().length === 0) {
    const opt = document.createElement('option'); opt.textContent = '(žádná jamka)'; sel.appendChild(opt);
  }
  holes().forEach(h => {
    const opt = document.createElement('option');
    opt.value = h.id; opt.textContent = `Jamka ${h.id}`;
    if (h.id === currentHoleId) opt.selected = true;
    sel.appendChild(opt);
  });
  sel.onchange = () => { currentHoleId = parseInt(sel.value); renderHoleList(); };
}

function renderHoleList() {
  const list = document.getElementById('hole-list');
  list.innerHTML = '';
  let totalLen = 0, complete = 0;
  holes().forEach(h => {
    const div = document.createElement('div');
    const isComplete = h.tee && h.basket;
    div.className = 'hole-row ' + (isComplete ? 'complete' : 'partial') + (h.id === currentHoleId ? ' active' : '');
    const hasNote = (h.note && h.note.trim()) || (h.photos && h.photos.length);
    const noteIcon = hasNote ? `<span title="${(h.photos||[]).length} foto${(h.note||'').trim() ? ', poznámka' : ''}" style="color:#fb0;font-weight:bold">📝${(h.photos||[]).length || ''}</span>` : '';
    const nameSuffix = h.name ? ` — <span style="color:#2c7">${(h.name+'').replace(/[<>&]/g,'')}</span>` : '';
    let info = `<div class="info"><b>Jamka ${h.id}</b>${nameSuffix} `;
    info += h.tee ? '<span style="color:#2c7">T✓</span>' : '<span style="color:#bbb">T·</span>';
    info += ' ';
    info += h.basket ? '<span style="color:#e63">K✓</span>' : '<span style="color:#bbb">K·</span>';
    info += ' ' + noteIcon;
    let dist = '';
    if (isComplete) {
      const d = haversine(h.tee, h.basket); totalLen += d; complete++;
      dist = `<div class="meta">${d.toFixed(0)} m</div>`;
    }
    info += dist + '</div>';
    div.innerHTML = info +
      `<button class="btn btn-icon" title="Poznámka a fotky" data-note="${h.id}">📝</button>` +
      `<button class="btn btn-danger btn-icon" data-del="${h.id}">×</button>`;
    div.querySelector('[data-note]').onclick = (e) => { e.stopPropagation(); openHoleNoteDialog(h); };
    div.querySelector('[data-del]').onclick = (e) => { e.stopPropagation(); deleteHole(h.id); };
    div.onclick = () => {
      currentHoleId = h.id;
      const p = h.tee || h.basket;
      if (p) map.flyTo([p.lat, p.lon], 19);
      renderHoleSelector(); renderHoleList();
    };
    list.appendChild(div);
  });
  document.getElementById('stats').innerHTML = `<b>${holes().length}</b> jamek, <b>${complete}</b> kompl., <b>${totalLen.toFixed(0)} m</b>`;
  document.getElementById('sculpt-count').textContent = SCULPTURES.length;
}

function updateExportBadge() {
  const badge = document.getElementById('export-badge');
  const badge2 = document.getElementById('export-badge2');
  const n = data.changesSinceExport || 0;
  if (n > 0) {
    badge.textContent = n;
    badge.classList.remove('hidden');
    badge2.textContent = ` (${n} změn)`;
    badge2.style.color = '#e63';
  } else {
    badge.classList.add('hidden');
    badge2.textContent = '';
  }
  const lastExp = localStorage.getItem(EXPORT_KEY);
  const info = document.getElementById('export-info');
  if (lastExp) {
    const t = new Date(parseInt(lastExp));
    info.textContent = `Naposledy exportováno: ${t.toLocaleString('cs')}`;
  } else {
    info.textContent = 'Ještě nebyl proveden export.';
  }
}

function bumpChanges() {
  data.changesSinceExport = (data.changesSinceExport || 0) + 1;
  if (data.changesSinceExport === 10 || data.changesSinceExport === 25 || data.changesSinceExport === 50) {
    showToast(`Tip: máš ${data.changesSinceExport} neexportovaných změn. 📥 Klikni Export.`, 5000);
  }
}

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function saveAndRender() { save(); renderHoles(); renderVariantBar(); renderHoleSelector(); renderHoleList(); updateExportBadge(); }

function newVariant() {
  const name = prompt('Název nového návrhu:', 'Návrh ' + (data.variants.length + 1));
  if (!name) return;
  const id = 'v' + Date.now();
  const colors = ['#2c7', '#1e88e5', '#9c27b0', '#ff9800', '#00838f', '#e91e63'];
  data.variants.push({ id, name, color: colors[data.variants.length % colors.length], holes: [] });
  data.activeVariantId = id; currentHoleId = null; bumpChanges(); saveAndRender();
}
function renameVariant() {
  const v = activeVariant();
  const name = prompt('Nový název:', v.name);
  if (name) { v.name = name; bumpChanges(); saveAndRender(); }
}
function duplicateVariant() {
  const v = activeVariant();
  const name = prompt('Název kopie:', v.name + ' (kopie)');
  if (!name) return;
  const id = 'v' + Date.now();
  data.variants.push({ id, name, color: v.color, holes: JSON.parse(JSON.stringify(v.holes)) });
  data.activeVariantId = id; bumpChanges(); saveAndRender();
}
function deleteVariant() {
  if (data.variants.length <= 1) { alert('Nelze smazat poslední návrh.'); return; }
  if (!confirm(`Smazat návrh "${activeVariant().name}"?`)) return;
  data.variants = data.variants.filter(v => v.id !== data.activeVariantId);
  data.activeVariantId = data.variants[0].id;
  currentHoleId = holes().length ? holes()[0].id : null;
  bumpChanges(); saveAndRender();
}
function resetParklifeDefault() {
  const pl = data.variants.find(v => v.id === 'parklife');
  if (!pl) {
    data.variants.unshift({ id: 'parklife', name: 'Parklife (původní návrh)', color: '#1e88e5', holes: JSON.parse(JSON.stringify(PARKLIFE_DEFAULT)) });
  } else {
    if (!confirm('Obnovit Parklife návrh do výchozího stavu?')) return;
    pl.holes = JSON.parse(JSON.stringify(PARKLIFE_DEFAULT));
  }
  data.activeVariantId = 'parklife';
  currentHoleId = holes().length ? holes()[0].id : null;
  bumpChanges(); saveAndRender();
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    updateMobileMode();
  };
});

function setMobileMode(m) {
  mode = (mode === m) ? 'view' : m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  updateMobileMode();
}

function updateMobileMode() {
  document.getElementById('mob-tee').classList.toggle('active', mode === 'add-tee');
  document.getElementById('mob-basket').classList.toggle('active', mode === 'add-basket');
}

map.on('click', e => {
  if (mode === 'view') return;
  const hs = holes();
  if (hs.length === 0 || currentHoleId === null) {
    const nextId = hs.length > 0 ? Math.max(...hs.map(h => h.id)) + 1 : 1;
    hs.push({ id: nextId });
    currentHoleId = nextId;
  }
  const hole = hs.find(h => h.id === currentHoleId);
  if (!hole) return;
  if (mode === 'add-tee') hole.tee = { lat: e.latlng.lat, lon: e.latlng.lng };
  else if (mode === 'add-basket') hole.basket = { lat: e.latlng.lat, lon: e.latlng.lng };
  bumpChanges();
  saveAndRender();
});

function newHole() {
  const hs = holes();
  const nextId = hs.length > 0 ? Math.max(...hs.map(h => h.id)) + 1 : 1;
  hs.push({ id: nextId }); currentHoleId = nextId; bumpChanges(); saveAndRender();
}
function deleteHole(id) {
  if (!confirm(`Smazat jamku ${id}?`)) return;
  const v = activeVariant();
  v.holes = v.holes.filter(h => h.id !== id);
  if (currentHoleId === id) currentHoleId = v.holes.length > 0 ? v.holes[0].id : null;
  bumpChanges(); saveAndRender();
}
function resetActiveHoles() {
  if (!confirm(`Smazat všechny jamky v návrhu "${activeVariant().name}"?`)) return;
  activeVariant().holes = []; currentHoleId = null; bumpChanges(); saveAndRender();
}

function download(name, content, mime) {
  const blob = new Blob([content], { type: mime || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
function safeName(s) { return s.replace(/[^a-z0-9_\-]/gi, '_'); }
function exportJSON() {
  download(`discgolf_${safeName(activeVariant().name)}.json`, JSON.stringify({ name: activeVariant().name, holes: holes() }, null, 2), 'application/json');
  data.changesSinceExport = 0;
  localStorage.setItem(EXPORT_KEY, Date.now().toString());
  save();
  updateExportBadge();
  showToast('✓ Export uložen do downloads', 2000);
}
function exportKML() {
  const items = [];
  holes().forEach(h => {
    if (h.tee) items.push(`<Placemark><name>T${h.id}</name><Point><coordinates>${h.tee.lon},${h.tee.lat},0</coordinates></Point></Placemark>`);
    if (h.basket) items.push(`<Placemark><name>K${h.id}</name><Point><coordinates>${h.basket.lon},${h.basket.lat},0</coordinates></Point></Placemark>`);
    if (h.tee && h.basket) items.push(`<Placemark><name>Jamka ${h.id}</name><LineString><coordinates>${h.tee.lon},${h.tee.lat},0 ${h.basket.lon},${h.basket.lat},0</coordinates></LineString></Placemark>`);
  });
  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${activeVariant().name}</name>
${items.join('\n')}
</Document></kml>`;
  download(`discgolf_${safeName(activeVariant().name)}.kml`, kml, 'application/vnd.google-earth.kml+xml');
}
function exportGPX() {
  const wpts = [];
  holes().forEach(h => {
    if (h.tee) wpts.push(`<wpt lat="${h.tee.lat}" lon="${h.tee.lon}"><name>T${h.id}</name></wpt>`);
    if (h.basket) wpts.push(`<wpt lat="${h.basket.lat}" lon="${h.basket.lon}"><name>K${h.id}</name></wpt>`);
  });
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="horice-designer" xmlns="http://www.topografix.com/GPX/1/1">
${wpts.join('\n')}
</gpx>`;
  download(`discgolf_${safeName(activeVariant().name)}.gpx`, gpx, 'application/gpx+xml');
}

document.getElementById('import-file').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      let importedHoles = [], importedName = null;
      if (file.name.toLowerCase().endsWith('.json')) {
        const parsed = JSON.parse(reader.result);
        if (Array.isArray(parsed)) importedHoles = parsed;
        else { importedHoles = parsed.holes || []; importedName = parsed.name; }
      } else if (file.name.toLowerCase().endsWith('.gpx')) {
        const doc = new DOMParser().parseFromString(reader.result, 'text/xml');
        const wpts = doc.querySelectorAll('wpt');
        const m = {};
        wpts.forEach(w => {
          const lat = parseFloat(w.getAttribute('lat')); const lon = parseFloat(w.getAttribute('lon'));
          const name = w.querySelector('name')?.textContent || '';
          const match = name.match(/^([TK])(\d+)$/i);
          if (match) {
            const id = parseInt(match[2]);
            if (!m[id]) m[id] = { id };
            m[id][match[1].toUpperCase() === 'T' ? 'tee' : 'basket'] = { lat, lon };
          }
        });
        importedHoles = Object.values(m).sort((a,b) => a.id - b.id);
      }
      const asNew = confirm(`Importovat ${importedHoles.length} jamek?\nOK = Přidat jako NOVÝ návrh\nCancel = Nahradit aktivní`);
      if (asNew) {
        const id = 'v' + Date.now();
        data.variants.push({ id, name: importedName || file.name.replace(/\.[^.]+$/, ''), color: '#9c27b0', holes: importedHoles });
        data.activeVariantId = id;
      } else activeVariant().holes = importedHoles;
      currentHoleId = importedHoles.length > 0 ? importedHoles[0].id : null;
      bumpChanges(); saveAndRender();
    } catch (err) { alert('Chyba: ' + err.message); }
  };
  reader.readAsText(file); e.target.value = '';
};

document.getElementById('show-buffers').onchange = () => {
  document.getElementById('buffer-radius-wrap').style.display = document.getElementById('show-buffers').checked ? 'block' : 'none';
  renderBuffers();
};

// --- Lock (zámek proti náhodnému posunutí markeru) ---
function updateLockUI() {
  const btn = document.getElementById('lock-toggle');
  if (!btn) return;
  btn.classList.toggle('locked', !!data.locked);
  btn.querySelector('.icon').textContent = data.locked ? '🔒' : '🔓';
  btn.title = data.locked ? 'Body uzamčeny proti drag&drop (klikni pro odemčení)' : 'Klikni pro zamčení bodů proti drag&drop';
}
function toggleLock() {
  data.locked = !data.locked;
  // Aktualizuj všechny existující markery bez re-renderu
  Object.values(markersByHole).forEach(g => {
    ['tee', 'basket'].forEach(t => {
      if (g[t] && g[t].dragging) {
        if (data.locked) g[t].dragging.disable();
        else g[t].dragging.enable();
      }
    });
  });
  save();
  updateLockUI();
  showToast(data.locked ? '🔒 Body uzamčeny — drag zablokován' : '🔓 Body odemčeny', 2000);
}

  document.getElementById('mob-sheet').classList.toggle('active', sb.classList.contains('expanded'));
}

// Swipe-down gesto pro zavření sheetu
(() => {
  const sb = document.getElementById('sidebar');
  let startY = null, dragging = false;
  sb.addEventListener('touchstart', e => {
    if (e.touches[0].clientY - sb.getBoundingClientRect().top < 40) {
      startY = e.touches[0].clientY; dragging = true;
    }
  }, { passive: true });
  sb.addEventListener('touchmove', e => {
    if (!dragging || startY === null) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 40) { closeSidebar(); dragging = false; startY = null; }
  }, { passive: true });
  sb.addEventListener('touchend', () => { dragging = false; startY = null; });
})();

// --- GPS ---
function toggleGeo() {
  if (geoWatchId !== null) {
    navigator.geolocation.clearWatch(geoWatchId);
    geoWatchId = null;
    userPosition = null;
    if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
    if (userAccuracyCircle) { map.removeLayer(userAccuracyCircle); userAccuracyCircle = null; }
    document.getElementById('mob-gps').classList.remove('gps-on');
    document.getElementById('gps-status').classList.remove('show');
    document.getElementById('fab-use-gps').classList.remove('show');
    return;
  }
  if (!navigator.geolocation) {
    alert('GPS API v prohlížeči není dostupné.');
    return;
  }
  document.getElementById('gps-status').textContent = '📍 Hledám GPS…';
  document.getElementById('gps-status').classList.add('show');
  geoWatchId = navigator.geolocation.watchPosition(
    pos => {
      const lat = pos.coords.latitude, lon = pos.coords.longitude, acc = pos.coords.accuracy;
      userPosition = { lat, lon, accuracy: acc };
      const wasFirst = !userMarker;
      if (!userMarker) {
        userMarker = L.marker([lat, lon], {
          icon: L.divIcon({ className: '', html: '<div class="gps-pulse"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }),
          interactive: false, keyboard: false, zIndexOffset: 2000
        }).addTo(map);
        userAccuracyCircle = L.circle([lat, lon], { radius: acc, color: '#2196f3', weight: 1, fillColor: '#2196f3', fillOpacity: 0.08 }).addTo(map);
      } else {
        userMarker.setLatLng([lat, lon]);
        userAccuracyCircle.setLatLng([lat, lon]).setRadius(acc);
      }
      const status = document.getElementById('gps-status');
      status.textContent = `📍 GPS ±${acc.toFixed(0)}m`;
      status.classList.toggle('warn', acc > 15);
      document.getElementById('mob-gps').classList.add('gps-on');
      document.getElementById('fab-use-gps').classList.add('show');
      if (wasFirst) map.setView([lat, lon], 19);
    },
    err => {
      let msg = 'GPS chyba';
      if (err.code === 1) msg = 'GPS: zamítnuto. Povol polohu v prohlížeči.';
      else if (err.code === 2) msg = 'GPS: signál nedostupný.';
      else if (err.code === 3) msg = 'GPS: timeout. Zkus znovu venku.';
      alert(msg);
      toggleGeo();
    },
    { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 }
  );
}

function openUseGPSDialog() {
  if (!userPosition) { alert('GPS není aktivní.'); return; }
  const info = document.getElementById('gps-accuracy-info');
  const acc = userPosition.accuracy;
  info.innerHTML = `GPS přesnost: <b>±${acc.toFixed(0)} m</b>`;
  if (acc > 15) info.innerHTML += ` <span style="color:#c63">⚠️ Nízká přesnost — bod nemusí přesně sedět</span>`;

  const targetList = document.getElementById('target-list');
  targetList.innerHTML = '';
  // Pro každou jamku 2 tlačítka (T, K) — pokud jamka nemá tee/basket, ukáže to "(nezadáno)"
  const hs = holes();
  // Add "Nová jamka — T" option na začátek
  const newBtn = document.createElement('button');
  newBtn.className = 'target-btn';
  newBtn.style.gridColumn = 'span 2';
  newBtn.innerHTML = `<b>+ Nová jamka — odpaliště</b>`;
  newBtn.onclick = () => { applyGPSTo({ newHole: true, type: 'tee' }); };
  targetList.appendChild(newBtn);

  hs.forEach(h => {
    [['tee', 'T'], ['basket', 'K']].forEach(([t, label]) => {
      const btn = document.createElement('button');
      btn.className = 'target-btn' + (h[t] ? ' exists' : '');
      let dist = '';
      if (h[t]) {
        const d = haversine(userPosition, h[t]);
        dist = `<div class="dist">vzdálenost ${d.toFixed(0)} m</div>`;
      } else {
        dist = `<div class="dist">(nezadáno)</div>`;
      }
      btn.innerHTML = `<b>J${h.id} — ${label}</b> ${dist}`;
      btn.onclick = () => { applyGPSTo({ holeId: h.id, type: t }); };
      targetList.appendChild(btn);
    });
  });

  document.getElementById('modal-backdrop').classList.add('show');
  document.getElementById('use-gps-dialog').classList.add('show');
}

function applyGPSTo(target) {
  if (!userPosition) return;
  const acc = userPosition.accuracy;
  if (acc > 15) {
    if (!confirm(`GPS přesnost je nízká (±${acc.toFixed(0)}m). Použít přesto?`)) return;
  }
  const pt = { lat: userPosition.lat, lon: userPosition.lon };
  let hole;
  if (target.newHole) {
    const hs = holes();
    const nextId = hs.length > 0 ? Math.max(...hs.map(h => h.id)) + 1 : 1;
    hole = { id: nextId };
    hs.push(hole);
    currentHoleId = nextId;
  } else {
    hole = holes().find(h => h.id === target.holeId);
  }
  if (hole) hole[target.type] = pt;
  bumpChanges();
  saveAndRender();
  closeAllModals();
  showToast(`✓ Bod uložen (±${acc.toFixed(0)}m)`, 2000);
}

function closeAllModals() {
  document.getElementById('modal-backdrop').classList.remove('show');
  document.getElementById('use-gps-dialog').classList.remove('show');
  document.getElementById('hole-note-dialog').classList.remove('show');
  document.getElementById('load-layout-dialog').classList.remove('show');
}

function openLoadLayoutDialog() {
  const list = document.getElementById('layout-list');
  list.innerHTML = '';
  if (!LAYOUTS_INDEX || LAYOUTS_INDEX.length === 0) {
    list.innerHTML = '<div style="color:#999">Žádné layouty na serveru.</div>';
  } else {
    LAYOUTS_INDEX.forEach(L => {
      const card = document.createElement('div');
      card.style.cssText = 'background:white;border:1px solid #ddd;border-radius:6px;padding:10px;';
      card.innerHTML = `
        <div style="font-weight:600;margin-bottom:2px">${(L.name+'').replace(/[<>&]/g,'')}</div>
        <div style="font-size:11px;color:#777;margin-bottom:8px">${(L.description+'').replace(/[<>&]/g,'')}</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-primary" data-id="${L.id}" data-mode="new" style="flex:1;padding:8px;font-size:12px;">+ Jako nový návrh</button>
          <button class="btn" data-id="${L.id}" data-mode="replace" style="flex:1;padding:8px;font-size:12px;">↻ Nahradit aktuální</button>
        </div>
      `;
      card.querySelectorAll('button').forEach(b => {
        b.onclick = async () => {
          const id = b.dataset.id;
          const mode = b.dataset.mode;
          try {
            const resp = await fetch(`layouts/${id}.json?cb=${Date.now()}`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const layoutData = await resp.json();
            if (mode === 'new') {
              const newId = 'v' + Date.now();
              const colors = ['#2c7', '#1e88e5', '#9c27b0', '#ff9800', '#00838f', '#e91e63'];
              data.variants.push({
                id: newId, name: layoutData.name || L.name,
                color: colors[data.variants.length % colors.length],
                holes: layoutData.holes || []
              });
              data.activeVariantId = newId;
              showToast(`✓ Načten layout "${layoutData.name || L.name}" jako nový návrh`, 3000);
            } else {
              if (!confirm(`Nahradit aktuální návrh "${activeVariant().name}" obsahem "${layoutData.name || L.name}"?\nAktuální data budou ztracena.`)) return;
              activeVariant().holes = layoutData.holes || [];
              if (layoutData.name) activeVariant().name = layoutData.name;
              showToast(`✓ Návrh "${activeVariant().name}" nahrazen`, 3000);
            }
            currentHoleId = holes().length > 0 ? holes()[0].id : null;
            bumpChanges();
            saveAndRender();
            closeAllModals();
          } catch (err) {
            alert('Chyba načítání layoutu: ' + err.message);
          }
        };
      });
      list.appendChild(card);
    });
  }
  document.getElementById('modal-backdrop').classList.add('show');
  document.getElementById('load-layout-dialog').classList.add('show');
}

function showToast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), ms || 3000);
}

if (typeof data.locked !== 'boolean') data.locked = false;

// --- PWA install prompt ---
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // Ukaž "Instalovat" tlačítko v sidebar pod exportem
  const info = document.getElementById('export-info');
  if (info && !document.getElementById('install-btn')) {
    const btn = document.createElement('button');
    btn.id = 'install-btn';
    btn.className = 'btn btn-primary';
    btn.style.marginTop = '8px';
    btn.textContent = '📲 Instalovat jako aplikaci';
    btn.onclick = async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      if (outcome === 'accepted') btn.remove();
      deferredInstallPrompt = null;
    };
    info.parentNode.insertBefore(btn, info.nextSibling);
  }
});
window.addEventListener('appinstalled', () => {
  const b = document.getElementById('install-btn'); if (b) b.remove();
  showToast('✓ Aplikace nainstalována', 3000);
});
